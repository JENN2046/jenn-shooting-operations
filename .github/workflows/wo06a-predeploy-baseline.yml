name: WO-06A Predeploy Baseline

on:
  push:
    branches:
      - codex/wo-06a-predeploy-evidence-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Local and container baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up fixed Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Record runtime facts
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          uname -a
          node --version
          npm --version
          node -p "JSON.stringify({node: process.versions.node, tz: process.versions.tz ?? null, icu: process.versions.icu ?? null})"

      - name: Install declared dependencies
        run: npm ci

      - name: Run repository check
        run: npm run check

      - name: Build container image
        run: docker build --pull -t jenn-shooting-operations:wo06a .

      - name: Verify image contract
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker image inspect jenn-shooting-operations:wo06a --format '{{.Config.User}}')"
          test "$user" = "node"
          cmd="$(docker image inspect jenn-shooting-operations:wo06a --format '{{json .Config.Cmd}}')"
          if grep -F -- '--experimental-sqlite' <<<"$cmd"; then
            echo "experimental sqlite flag must not be present" >&2
            exit 1
          fi

      - name: Protected default path refuses empty-volume startup
        shell: bash
        run: |
          set -euo pipefail
          name="jso-protected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$name" >/dev/null
          docker run -d --name "$name" -v "$name:/app/data" jenn-shooting-operations:wo06a
          code="$(timeout 30 docker wait "$name")"
          test "$code" != "0"
          docker logs "$name" > protected-startup.log 2>&1
          grep -F 'G3_AUTHORITY_RECONCILIATION_STARTUP_BLOCKED' protected-startup.log
          if grep -F 'Jenn Shooting Operations listening' protected-startup.log; then exit 1; fi
          docker run --rm --entrypoint node -v "$name:/app/data:ro" jenn-shooting-operations:wo06a -e "const fs=require('node:fs');if(fs.readdirSync('/app/data').length)throw Error('protected startup wrote data');"

      - name: Ordinary non-production empty-volume startup and same-volume persistence
        shell: bash
        run: |
          set -euo pipefail
          name="jso-ordinary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$name" >/dev/null
          start() {
            docker run -d --name "$name" -v "$name:/app/data" \
              -e DATABASE_PATH=/app/data/ci-ordinary.sqlite \
              -e KIOSK_SERVICE_CONTEXT=WO03_ISOLATED_ACCEPTANCE \
              -e VIEWER_TOKEN=viewer-token-wo06a-000000000001 \
              -e SUBMITTER_TOKEN=submitter-token-wo06a-000000001 \
              -e SCHEDULER_TOKEN=scheduler-token-wo06a-000000001 \
              -e ADMIN_TOKEN=admin-token-wo06a-00000000001 \
              jenn-shooting-operations:wo06a
            for attempt in $(seq 1 30); do
              if docker exec "$name" node -e "fetch('http://127.0.0.1:3800/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then return; fi
              sleep 1
            done
            docker logs "$name" >&2
            return 1
          }
          start
          test "$(docker exec "$name" id -u)" != "0"
          docker exec "$name" test -f /app/data/ci-ordinary.sqlite
          docker stop "$name" >/dev/null
          docker rm "$name" >/dev/null
          # Offline synthetic state in this disposable ordinary database only.
          docker run --rm --entrypoint node -v "$name:/app/data" jenn-shooting-operations:wo06a -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/app/data/ci-ordinary.sqlite');db.exec(\"INSERT INTO audit_log(action,role,entity_id,revision,result,created_at) VALUES ('ci.persistence','system','ordinary-restart-proof',0,'synthetic','2026-10-14T00:00:00.000Z')\");db.close();"
          start
          docker exec "$name" node -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/app/data/ci-ordinary.sqlite',{readOnly:true});if(db.prepare(\"SELECT entity_id FROM audit_log WHERE action='ci.persistence'\").get().entity_id!=='ordinary-restart-proof')throw Error('persistence lost');if(!db.prepare('SELECT COUNT(*) AS n FROM schema_migrations').get().n)throw Error('schema missing');db.close();"

      - name: Cleanup only this run's disposable resources
        if: always()
        shell: bash
        run: |
          for kind in protected ordinary; do
            name="jso-${kind}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$name" >/dev/null 2>&1 || true
          done
